packages:
  - "typescript/*"
  - "examples/*"
  - "e2e"

allowBuilds:
  "@vscode/vsce-sign": true
  esbuild: true
  keytar: true
  lefthook: true

# Security floors: the advisory-patched releases sit outside the ranges our dependents declare,
# so pin the floor here. Same-major patch bumps where a patched release exists in that major;
# CVE-2026-14257 (brace-expansion OOM) is patched ONLY in 5.0.8 — no 2.x backport — so the 2.x
# consumers cross majors (test-verified: the default-export expand() surface is unchanged).
# The esbuild pin lifts drizzle-kit's deprecated @esbuild-kit loader off the 0.18 dev-server
# advisory (GHSA-67mh-4wv8-2f99); it uses transform only, and 0.25 keeps that API.
overrides:
  "brace-expansion@>=2.0.0 <3.0.0": 5.0.8
  "brace-expansion@>=5.0.0 <6.0.0": 5.0.8
  "esbuild@>=0.18.0 <0.19.0": 0.25.12
  "fast-uri@>=3.0.0 <4.0.0": 3.1.4
